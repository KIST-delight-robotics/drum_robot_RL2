seed: 42

models:
  policy:
    class: GaussianMixin
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 160, 128]
        activations: elu
    output: ACTIONS # action_dim=9
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 160, 128] #512, 256, 128]
        activations: elu
    output: ONE # value_dim=1

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 64 #64
  learning_epochs: 4
  mini_batches: 4 #4
  # 유효 지평 = 1/(1-gamma) 스텝. 시간으로 보존해야 하므로 제어주기를 바꾸면 같이 바꿀 것.
  #   66.667Hz: 0.991 → 111스텝 × 0.015s = 1.67초  (60Hz 의 0.99 = 100스텝 × 1/60 과 동일)
  #   환산식: new_gamma = old_gamma ^ (old_hz / new_hz).  0.99^(60/66.667) = 0.991
  discount_factor: 0.991
  lambda: 0.95
  learning_rate: 1.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.001
  value_loss_scale: 1.0 #2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0 #0.1
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    directory: "drum_robot"
    experiment_name: "drum_robot"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 500000 #1000000
  environment_info: log
